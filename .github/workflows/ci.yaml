
name: Flask CI

# When should CI run?
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get project source code
      - name: Checkout code
        uses: actions/checkout@v4
 
      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Check Python syntax
      - name: Check syntax
        run: python -m compileall -q .

      # 5. Test Flask application
      - name: Test Flask app
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/'); assert response.status_code == 200"
