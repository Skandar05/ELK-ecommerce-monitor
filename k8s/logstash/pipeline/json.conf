input {
  tcp {
    port => 5000
    codec => json_lines
    add_tag => ["json_tcp"]
  }

  file {
    path => "/usr/share/logstash/data/input/json/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-json"
    codec => json
    add_tag => ["json_file"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ecommerce-json-%{+YYYY.MM.dd}"
  }
}
