apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: logcommerce
data:
  kibana.yml: |
    server.host: 0.0.0.0
    server.port: 5601
    server.name: logcommerce-kibana
    server.basePath: /kibana
    server.rewriteBasePath: true
    server.publicBaseUrl: http://logcommerce.local/kibana
    elasticsearch.hosts: ["http://elasticsearch:9200"]
