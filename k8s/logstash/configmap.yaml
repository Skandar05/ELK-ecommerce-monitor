apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: logcommerce
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "ecommerce-logs-%{+YYYY.MM.dd}"
      }
    }
