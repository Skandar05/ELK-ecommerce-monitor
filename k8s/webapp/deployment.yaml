apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: logcommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: logcommerce-webapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: webapp-config
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: logcommerce-secrets
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logcommerce-secrets
                  key: mongo-root-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logcommerce-secrets
                  key: redis-password
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: logcommerce-secrets
                  key: flask-secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
