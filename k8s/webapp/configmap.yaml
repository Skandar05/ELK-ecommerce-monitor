apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: logcommerce
data:
  ELASTICSEARCH_HOSTS: http://elasticsearch:9200
  LOGSTASH_HOST: logstash
  LOGSTASH_PORT: "5000"
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DATABASE: logcommerce
  MONGO_AUTH_SOURCE: admin
  REDIS_HOST: redis
  REDIS_PORT: "6379"
