
name: Flask CI

# When should CI run?
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/backend


    steps:
      # 1. Get project source code
      - name: Checkout code
        uses: actions/checkout@v4
 
      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Check Python syntax
      - name: Check syntax
        run: python -m compileall -q .

      # 5. Test Flask application
      - name: Test Flask app
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/'); assert response.status_code == 200"
      


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Docker Build
        run: docker build -t skandar55/monitoring-backend:latest .

 
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skandar55/monitoring-backend:latest
          severity: CRITICAL
          exit-code: 1

      - name: docker push
        run: docker push skandar55/monitoring-backend:latest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Docker Build
        run: docker build -t skandar55/monitoring-frontend:latest .

 
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skandar55/monitoring-frontend:latest
          severity: CRITICAL
          exit-code: 1

      - name: docker push
        run: docker push skandar55/monitoring-frontend:latest





