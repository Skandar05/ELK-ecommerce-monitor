input {
  file {
    path => "/usr/share/logstash/data/input/csv/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-csv"
    codec => plain
    add_tag => ["csv_file"]
  }
}

filter {
  csv {
    separator => ","
    columns => ["timestamp", "service", "level", "message"]
    skip_header => true
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ecommerce-csv-%{+YYYY.MM.dd}"
  }
}
